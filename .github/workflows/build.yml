name: Dash Game Space

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name dash_game_space --org com.nrsqxw .
      - name: Apply Dash bridge configuration
        run: |
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/nrsqxw/dashgamespace
          cp config/BridgeChannel.kt android/app/src/main/kotlin/com/nrsqxw/dashgamespace/BridgeChannel.kt
          rm -f test/widget_test.dart
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DASH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.DASH_RELEASE_KEY_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.DASH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "DASH_RELEASE_KEYSTORE_BASE64 is required" >&2; exit 1; }
          [ -n "$KEYSTORE_PASS" ] || { echo "DASH_RELEASE_KEY_PASS is required" >&2; exit 1; }
          keystore="$RUNNER_TEMP/dash-game-space-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          alias_name="${KEYSTORE_ALIAS:-dash-essential}"
          {
            echo "DASH_GS_KEYSTORE=$keystore"
            echo "DASH_GS_KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "DASH_GS_KEY_ALIAS=$alias_name"
          } >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'
android {
    signingConfigs {
        release {
            storeFile file(System.getenv("DASH_GS_KEYSTORE"))
            storePassword System.getenv("DASH_GS_KEYSTORE_PASS")
            keyAlias System.getenv("DASH_GS_KEY_ALIAS")
            keyPassword System.getenv("DASH_GS_KEYSTORE_PASS")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRADLE
      - name: Flutter tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-game-space-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes="$(awk -v want="$version" '
            index($0, "## " want) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="Release $version"
          fi
          {
            printf '## Dash Game Space %s\n\n' "$tag"
            printf 'Game Space with Dash Essential integration.\n\n'
            printf '[Read the README](https://github.com/afrizal1211/dash-game-space#readme)\n\n'
            printf '### Changelog\n\n'
            printf '%s\n\n' "$notes"
            printf '### How to use\n\n'
            printf 'Install Dash Essential first. Both apps must share the same signing key.\n'
            printf 'Open the app, then use Home to reach games, profiles, tune and widgets.\n\n'
            printf '### Author\n\n'
            printf '[afrizal1211](https://github.com/afrizal1211)\n'
          } > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Dash Game Space $tag" --notes-file release-notes.md
            gh release upload "$tag" build/app/outputs/flutter-apk/app-release.apk --clobber
          else
            gh release create "$tag" \
              --title "Dash Game Space $tag" \
              --notes-file release-notes.md \
              build/app/outputs/flutter-apk/app-release.apk
          fi
