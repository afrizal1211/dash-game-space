name: Dash Game Space Compose

on:
  push:
    branches: [main]
    paths:
      - 'compose/**'
      - '.github/workflows/compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Compose APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: cd compose && gradle assembleDebug --no-daemon
